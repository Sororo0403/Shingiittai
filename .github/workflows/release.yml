name: Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: >
          msbuild Shingiittai.slnx
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v145
          /p:WindowsTargetPlatformVersion=10.0

      - name: Verify runtime output
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "..\generated\outputs\Release\App"
          $requiredFiles = @(
            "App.exe",
            "JoyShockLibrary.dll",
            "assimp-vc145-mt.dll",
            "app\resources\title\title_logo.png",
            "engine\resources\shaders\sprite\SpriteVS.hlsl"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $outputDir $file
            if (-not (Test-Path $path)) {
              throw "Required output is missing: $path"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shingiittai-Release-x64
          path: |
            ../generated/outputs/Release/App/**
            !../generated/outputs/Release/App/*.ilk
            !../generated/outputs/Release/App/*.lib
            !../generated/outputs/Release/App/*.pdb

  publish:
    name: Publish GitHub Release
    runs-on: windows-2025-vs2026
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: Shingiittai-Release-x64
          path: dist/Shingiittai

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Shingiittai/* -DestinationPath Shingiittai-${{ github.ref_name }}-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "Shingiittai-${{ github.ref_name }}-x64.zip" `
            --title "Shingiittai ${{ github.ref_name }}" `
            --notes "Automated Release build for ${{ github.ref_name }}."
